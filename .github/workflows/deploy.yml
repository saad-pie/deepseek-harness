name: Deploy DeepSeek Harness to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build Web App
        run: pnpm --filter @deepseek-harness/web build || pnpm --filter ./apps/web build || pnpm run build

      - name: Locate Build Output Directory
        id: locate-dist
        run: |
          if [ -d "./apps/web/dist" ]; then
            echo "path=./apps/web/dist" >> $GITHUB_OUTPUT
          elif [ -d "./apps/web/build" ]; then
            echo "path=./apps/web/build" >> $GITHUB_OUTPUT
          elif [ -d "./apps/web/out" ]; then
            echo "path=./apps/web/out" >> $GITHUB_OUTPUT
          elif [ -d "./apps/web/.next" ]; then
            echo "path=./apps/web/.next" >> $GITHUB_OUTPUT
          elif [ -d "./dist" ]; then
            echo "path=./dist" >> $GITHUB_OUTPUT
          elif [ -d "./build" ]; then
            echo "path=./build" >> $GITHUB_OUTPUT
          else
            echo "::error::Could not find build output folder! Printing directory tree..."
            find . -maxdepth 3 -type d
            exit 1
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.locate-dist.outputs.path }}

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        
